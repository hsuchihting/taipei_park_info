<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雙北公園探索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#1d2a24",
              moss: "#2f6f4e",
              leaf: "#5f8f4f",
              river: "#3b82a0",
              clay: "#b4532f",
              mist: "#f3f7f1"
            },
            boxShadow: {
              soft: "0 18px 45px rgba(29, 42, 36, 0.12)"
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-mist text-ink antialiased">
    <main class="min-h-screen">
      <section class="border-b border-ink/10 bg-white">
        <div class="mx-auto grid max-w-7xl gap-5 px-4 py-5 sm:px-6 lg:grid-cols-[1fr_auto] lg:px-8">
          <div>
            <p class="text-sm font-medium text-moss">台北市、新北市、桃園市與防災公園資料整合</p>
            <h1 class="mt-1 text-2xl font-semibold tracking-normal text-ink sm:text-3xl">北北桃公園探索</h1>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center text-sm">
            <div class="rounded-md border border-ink/10 bg-mist px-4 py-3">
              <div id="stat-total" class="text-xl font-semibold text-ink">-</div>
              <div class="text-ink/60">總筆數</div>
            </div>
            <div class="rounded-md border border-ink/10 bg-mist px-4 py-3">
              <div id="stat-disaster" class="text-xl font-semibold text-clay">-</div>
              <div class="text-ink/60">防災據點</div>
            </div>
            <div class="rounded-md border border-ink/10 bg-mist px-4 py-3">
              <div id="stat-map" class="text-xl font-semibold text-river">-</div>
              <div class="text-ink/60">可定位</div>
            </div>
          </div>
        </div>
      </section>

      <section class="mx-auto grid max-w-7xl gap-4 px-4 py-4 sm:px-6 lg:grid-cols-[360px_minmax(0,1fr)] lg:px-8">
        <aside class="space-y-4">
          <div class="rounded-md border border-ink/10 bg-white p-4 shadow-soft">
            <label for="search" class="text-sm font-medium text-ink/70">搜尋</label>
            <input
              id="search"
              type="search"
              placeholder="公園名稱、地址、行政區、設施"
              class="mt-2 w-full rounded-md border border-ink/15 bg-white px-3 py-2 text-base outline-none ring-moss/20 placeholder:text-ink/40 focus:border-moss focus:ring-4"
            />

            <div class="mt-4">
              <div class="text-sm font-medium text-ink/70">城市</div>
              <div id="city-filters" class="mt-2 grid grid-cols-2 gap-2"></div>
            </div>

            <div class="mt-4">
              <div class="text-sm font-medium text-ink/70">使用情境</div>
              <div id="scenario-filters" class="mt-2 grid grid-cols-2 gap-2"></div>
            </div>

            <div class="mt-4 grid grid-cols-2 gap-3">
              <label class="text-sm font-medium text-ink/70">
                行政區
                <select id="district" class="mt-2 w-full rounded-md border border-ink/15 bg-white px-3 py-2 outline-none focus:border-moss">
                  <option value="">全部</option>
                </select>
              </label>
              <label class="text-sm font-medium text-ink/70">
                排序
                <select id="sort" class="mt-2 w-full rounded-md border border-ink/15 bg-white px-3 py-2 outline-none focus:border-moss">
                  <option value="relevance">推薦</option>
                  <option value="area">面積大到小</option>
                  <option value="capacity">防災容量大到小</option>
                  <option value="name">名稱</option>
                </select>
              </label>
            </div>
          </div>

          <div class="rounded-md border border-ink/10 bg-white p-4">
            <div class="flex items-center justify-between">
              <h2 class="font-semibold">搜尋結果</h2>
              <span id="result-count" class="text-sm text-ink/60">-</span>
            </div>
            <div id="park-list" class="mt-3 max-h-[58vh] space-y-2 overflow-auto pr-1"></div>
          </div>
        </aside>

        <section class="grid gap-4 lg:grid-rows-[360px_minmax(0,1fr)]">
          <div class="rounded-md border border-ink/10 bg-white p-4 shadow-soft">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="font-semibold">座標分布</h2>
                <p class="text-sm text-ink/60">台北市與防災公園可定位；新北資料目前以地址查詢為主</p>
              </div>
              <div class="flex gap-2 text-xs">
                <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-full bg-moss"></span>公園</span>
                <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-full bg-river"></span>綠地/廣場</span>
                <span class="inline-flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-full bg-clay"></span>防災</span>
              </div>
            </div>
            <div id="map" class="relative mt-3 h-[275px] overflow-hidden rounded-md border border-ink/10 bg-[linear-gradient(135deg,#eef6ee,#e8f2f5)]"></div>
          </div>

          <div id="detail" class="rounded-md border border-ink/10 bg-white p-5 shadow-soft">
            <div class="flex h-full min-h-[260px] items-center justify-center text-center text-ink/60">
              從左側選擇一座公園，查看完整資訊。
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
