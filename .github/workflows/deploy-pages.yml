name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch Taoyuan parks
        run: |
          curl --fail --location --retry 2 --max-time 30 \
            "https://opendata.tycg.gov.tw/api/v1/dataset.api_access?rid=cc8663dc-51f4-4a4f-9da1-f3fc266dc0c2&format=json" \
            --output "public/桃園市特色公園.json" \
            || echo "⚠️ Taoyuan API unreachable, using existing data if available"

      - name: Verify Taoyuan parks
        run: |
          node -e "const fs=require('fs'); const p='public/桃園市特色公園.json'; const rows=JSON.parse(fs.readFileSync(p,'utf8').replace(/^\uFEFF/,'')); if (!Array.isArray(rows) || rows.length === 0) throw new Error('Taoyuan parks data is missing'); console.log('Taoyuan parks:', rows.length)"

      - name: Build
        run: npm run build
        env:
          NUXT_APP_BASE_URL: /taipei_park_info/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
